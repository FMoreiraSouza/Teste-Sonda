version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: aircraft-postgres
    environment:
      POSTGRES_DB: aircraft_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aircraft-net

  backend:
    build: ./aircraft-management-api
    container_name: aircraft-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: s3
      DB_URL: jdbc:postgresql://postgres:5432/aircraft_db
      DB_USER: postgres
      DB_PASSWORD: 1234
      AWS_ACCESS_KEY_ID: AKIATSV7OUQ7J7V52HUR
      AWS_SECRET_ACCESS_KEY: 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
      AWS_REGION: sa-east-1
      AWS_S3_BUCKET: aircraft-images-felipe
    depends_on:
      - postgres
    networks:
      - aircraft-net

  frontend:
    build: ./aircraft-management-spa
    container_name: aircraft-frontend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - aircraft-net

volumes:
  postgres_data:

networks:
  aircraft-net: